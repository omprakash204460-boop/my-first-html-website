<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section id="contact">
        <h2>Contact me</h2>
        <p><big>Feel free to contact me for any project, internships or collaboration opportunity.</big></p>
        <form action="#" method="post">
            <!--full name-->
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" placeholder="enter your full name" required><br>
            <!--email-->
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="enter your email" required><br>
            <!--phone number-->
            <label for="phone">Phone number:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required><br>
            <!--Subject-->
            <label for="Subject">Subject:</label><br>
            <input type="Subject" id="Subject" name="Subject" placeholder="Enter your Subject name" required><br>
            <!--Messages-->
            <label for="Messages">Messages:</label><br>
            <textarea id="Messages" name="messages" row="6" placeholder="Write your message here." required></textarea><br>
            <!--Submit Button-->
            <button type="Submit">Send Messages</button>
        </form>
    </section>
</body>
</html>
